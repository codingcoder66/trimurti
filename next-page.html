<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiva</title>
    <style>
        body {
            background-image: url(shiv.jpg);
            background-repeat: no-repeat;
            background-position: top;
            font-family: sans-serif; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;      
            margin: 0;
        }
        
        
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 640px; 
        }

        .box2 {
            background-color: red;
            border: 10px solid black; 
            padding: 20px; 
            width: 100%;       
            box-sizing: border-box; 
            border-radius: 8px; 
        }

        p {
            color: black;
            font-size: large;
            line-height: 1.6;
            margin: 0; 
        }
         
        .button-container {
            text-align: center; 
            margin-top: 20px;   
        }

        .next-button {
            background-color: slategrey; 
            color: white;              
            padding: 10px 20px;        
            text-decoration: none;     
            border-radius: 5px;        
            display: inline-block;     
            font-family: Arial, sans-serif;
        }

        .next-button:hover {
            background-color: #0056b3; 
        }
    </style>
</head>
<body>
    <h1>Shiva</h1>
   
    <div class="content-wrapper">
        <div class="box2">
            <p>
               He is part of the Trimurti (the Hindu trinity), which includes Brahma (the Creator) and Vishnu (the Preserver). Shiva's role is to destroy the universe in order to re-create it, clearing away illusions and imperfections
            </p>
        </div>
        
        <div class="button-container">
            <a href="3.html" class="next-button">Next Page</a>
        </div>
    </div>
</body>
</html>
